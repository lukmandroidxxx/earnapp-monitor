name: earnapp-monitor

services:
  app:
    build: .
    image: earnapp-monitor:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Container harus mendengar di semua interface, bukan 127.0.0.1.
      HOST: 0.0.0.0
      PORT: "8080"
      # Server tanpa desktop: login helper tidak bisa membuka browser.
      LOGIN_HELPER: "0"
    volumes:
      # Database, cookie terenkripsi, dan kunci enkripsi harus tetap ada
      # setelah container di-restart.
      - ./data:/app/data
      - ./secrets:/app/secrets
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8080), 3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN di .env, contoh 203.0.113.10.sslip.io}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
