services:
  - type: web
    name: earnapp-monitor
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /ping
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: GOOGLE_SHEET_ID
        value: 1CI1p_r8tGFztywALNbIT9yjjaMcwK_sphOhZ-Gnr8nA
      - key: GOOGLE_SHEET_GID
        value: "0"
      - key: DASHBOARD_USER
        value: admin
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: LOGIN_HELPER
        value: "0"
      - key: AUTO_SYNC
        value: "1"
      - key: AUTO_POLL
        value: "0"
      - key: DEVICE_SYNC
        value: "1"
      - key: SCRAPER_MODE
        value: "off"
      - key: SHEET_WRITEBACK
        value: "0"
      - key: EARN_APP_API_BASE
        value: https://earnapp.com/dashboard/api
      - key: EARN_APP_APP_VERSION
        value: "1.685.135"
      - key: REQUEST_TIMEOUT
        value: "30"
